info:
  name: Create QC tool
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/qcs/qc-tools/"
  body:
    type: json
    data: |-
      {
        "category": "{{qc_category_id}}",
        "tool_name": "Hurl Digital Caliper",
        "tool_name_cn": "Hurl 数显卡尺",
        "serial_number": "HURL-QC-20260909-001",
        "company_no": "HURL-QC-001",
        "manufacturer": "Hurl Test Fixture",
        "range": "0-150 mm",
        "quantity": 1,
        "inspection_date": "2026-09-09",
        "next_inspection_date": "2027-09-09",
        "condition": "available",
        "remarks": "Temporary QC tool created by Bruno CRUD testing."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data && data.id) bru.setEnvVar('qc_tool_id', data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a QC tool linked to {{qc_category_id}} and capture qc_tool_id.
