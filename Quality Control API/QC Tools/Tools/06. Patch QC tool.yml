info:
  name: Patch QC tool
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/qcs/qc-tools/{{qc_tool_id}}/"
  body:
    type: json
    data: |-
      {
        "condition": "calibrated",
        "remarks": "Updated by the Bruno CRUD collection."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Partially update the captured QC tool condition and remarks.
