info:
  name: list CP entries for a document
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/entries/?document=1"
  params:
    - name: document
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: list Control Plan entries for one Control Plan document.
  Backend: GET /qcs/control-plan/entries/?document=<id> handled by ControlPlanEntryListView.
  Filters: document, work_step, part, inquiry_part, and sub_part.
  Returned list fields: id, document, work_step, sub_part fields, process_name, sequence_no, machine_device_tool, sample_volume, sample_frequency, control_method, effective_inspection_rate.
  Frontend note: use detail endpoint for full editable fields such as product_feature, process_feature, classification, specification_tolerance, evaluation_method, and reaction_plan.
  Response: success/message/data array.
