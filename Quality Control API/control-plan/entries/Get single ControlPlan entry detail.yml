info:
  name: Get single ControlPlan entry detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/entries/1/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: fetch a single Control Plan entry for editing.
  Backend: GET /qcs/control-plan/entries/{id}/ handled by ControlPlanEntryDetailView.
  Detail fields: document, work_step, sub_part display fields, process_name, fmea_entry, sequence_no, machine_device_tool, product_feature, process_feature, classification, specification_tolerance, evaluation_method, sample_volume, sample_frequency, control_method, reaction_plan, effective_inspection_rate, effective_check_time.
  Validation context: fmea_entry must be for the same WorkStep and same document scope.
  Response: success/message/data object.
