info:
  name: list inspection plans
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/inspection-plans/?control_plan_entry=1"
  params:
    - name: control_plan_entry
      value: "1"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: list Inspection Plans for a Control Plan entry.
  Backend: GET /qcs/control-plan/inspection-plans/?control_plan_entry=<id> handled by InspectionPlanListView.
  Filters: control_plan_entry, inquiry_part, is_active, and inspection_level.
  Returned fields: id, control_plan_entry, inquiry_part, planned_batch_quantity, aql_level, inspection_level, consecutive_clean_batches, consecutive_failed_batches, is_active, created_at, updated_at.
  Model options: inspection_level is Reduced, Normal, Tightened, or Full. AQL choices are 1.0, 1.5, 2.5, 4.0.
  Response: success/message/data array.
