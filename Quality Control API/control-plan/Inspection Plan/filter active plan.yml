info:
  name: filter active plan
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/inspection-plans/?is_active=true"
  params:
    - name: is_active
      value: "true"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: list active Inspection Plans.
  Backend: GET /qcs/control-plan/inspection-plans/?is_active=true handled by InspectionPlanListView.
  Filter behavior: is_active accepts true/1 or false/0 strings. Backend also supports control_plan_entry, inquiry_part, and inspection_level filters.
  Frontend note: inactive plans have been deactivated by switching rules after repeated failures and need manual QC review.
  Response: success/message/data array.
