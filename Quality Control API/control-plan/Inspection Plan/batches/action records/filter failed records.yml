info:
  name: filter failed records
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/inspection-records/?batch=1&result=Fail"
  params:
    - name: batch
      value: "1"
      type: query
    - name: result
      value: Fail
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: list failed inspection records for a batch.
  Backend: GET /qcs/control-plan/inspection-records/?batch=<id>&result=Fail handled by InspectionRecordListView.
  Result choices: Pass, Fail, Rework.
  Frontend note: use this for defect review, failure count display, and lot rejection analysis. Fail records should include defect_description where available.
  Response: success/message/data array.
