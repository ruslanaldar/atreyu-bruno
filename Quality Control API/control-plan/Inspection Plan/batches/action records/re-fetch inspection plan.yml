info:
  name: re-fetch inspection plan
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/qcs/control-plan/inspection-plans/1/"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: re-fetch an Inspection Plan after records or batch close may have changed switching state.
  Backend: GET /qcs/control-plan/inspection-plans/{id}/ handled by InspectionPlanDetailView.
  Why re-fetch: InspectionBatch.close_batch applies switching rules and can update inspection_level, consecutive counters, and is_active.
  Frontend note: call this after a batch closes, especially if the UI shows AQL mode, clean/failed counters, or active/inactive state.
  Response: success/message/data object.
