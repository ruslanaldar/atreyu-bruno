info:
  name: Create green QC PartTicket
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/mobile/timetickets/qc-tickets/green/"
  body:
    type: multipart-form
    data:
      - name: tz_number
        type: text
        value: "{{tz_number}}"
      - name: container_no
        type: text
        value: s363
      - name: pp_no
        type: text
        value: "60000509"
      - name: erp_no
        type: text
        value: "59501879"
      - name: station
        type: text
        value: l01
      - name: sub_station
        type: text
        value: l0103
      - name: completed_qty
        type: text
        value: "3.00"
      - name: unit_processing_time
        type: text
        value: "5.00"
      - name: emp_id
        type: text
        value: "479"
      - name: emp_name
        type: text
        value: Tang Jixiao
      - name: man_seq
        type: text
        value: "1"
      - name: notes
        type: text
        value: GREEN ticket for EmployeeTZ QC pass
      - name: images
        type: file
        value: []
        contentType: image/jpeg
      - name: images
        type: file
        value: []
        contentType: image/jpeg
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        if (body && body.ticket_id) bru.setEnvVar('green_ticket_id', body.ticket_id);
        if (body && body.data && body.data.ticket_id) bru.setEnvVar('green_ticket_id', body.data.ticket_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a GREEN QC PartTicket linked by tz_number. Although the route lives under /mobile/timetickets/, this request is part of the web checklist close flow because checklist can_close depends on a GREEN ticket.
