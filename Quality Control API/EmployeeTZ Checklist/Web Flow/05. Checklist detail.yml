info:
  name: Checklist detail
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/qcs/employee-tz/checklists/{{checklist_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data) {
          if (data.control_plan) bru.setEnvVar('control_plan_id', data.control_plan);
          if (data.control_plan_entry) bru.setEnvVar('control_plan_entry_id', data.control_plan_entry);
          if (data.fmea_entry) bru.setEnvVar('fmea_entry_id', data.fmea_entry);
          if (data.items && data.items[0] && data.items[0].id) bru.setEnvVar('checklist_item_id', data.items[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Full checklist detail. Includes checklist items, part/subpart/workstep details, FMEA entry detail, control plan entry/detail, inspection plan detail, inspection batch detail, and green_tickets list.
