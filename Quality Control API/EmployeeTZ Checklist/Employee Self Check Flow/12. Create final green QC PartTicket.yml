info:
  name: 12. Create final green QC PartTicket
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/mobile/timetickets/qc-tickets/green/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "tz_number": "{{tz_number}}",
        "container_no": "s363",
        "pp_no": "60000509",
        "erp_no": "59501879",
        "station": "l01",
        "sub_station": "l0103",
        "completed_qty": "11",
        "unit_processing_time": "5.00",
        "emp_id": "479",
        "emp_name": "Tang Jixiao",
        "man_seq": 1,
        "notes": "QC final GREEN ticket after EmployeeSelfCheck review"
      }
  auth:
    type: bearer
    token: "{{qc_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        var body = res.getBody();
        test("QC created the final GREEN PartTicket", function () {
          expect(body.success).to.equal(true);
          expect(body).to.have.nested.property('part_ticket.status', 'green');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: QC reviewer creates the established final GREEN PartTicket using qc_token. EmployeeSelfCheck remains the handoff and audit context; MPP updates continue through the existing ticket endpoint.
