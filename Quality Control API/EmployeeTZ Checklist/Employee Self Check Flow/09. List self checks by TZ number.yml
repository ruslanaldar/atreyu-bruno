info:
  name: 09. List self checks by TZ number
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/qcs/employee-self-checks/?tz_number={{tz_number}}"
  params:
    - name: tz_number
      value: "{{tz_number}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Submitted self-check is returned", function () {
          expect(body.success).to.equal(true);
          expect(String(body.data[0].id)).to.equal(String(bru.getEnvVar('self_check_id')));
          expect(body.data[0].status).to.equal('submitted');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Employee retrieves the submitted EmployeeSelfCheck by tz_number.
