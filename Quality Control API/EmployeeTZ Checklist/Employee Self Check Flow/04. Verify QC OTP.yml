info:
  name: 04. Verify QC OTP
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/organization/categories/otp/verify-otp/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{qc_email}}",
        "otp": "{{qc_otp}}",
        "purpose": "login"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("QC access token exists", function () {
          expect(body).to.have.property('access');
        });
        if (body && body.access) bru.setEnvVar('qc_token', body.access);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Set qc_email and qc_otp in the active environment, then capture qc_token for final QC actions.
