info:
  name: 03. Request QC OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/organization/categories/otp/request-otp/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{qc_email}}",
        "purpose": "login"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Set qc_email in the active environment, then request the QC reviewer's OTP.
