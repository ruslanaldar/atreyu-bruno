info:
  name: 02. Verify employee OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/organization/categories/otp/verify-otp/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "ruslan.aldar@gmail.com",
        "otp": "292929",
        "purpose": "login"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Employee access token exists", function () {
          expect(body).to.have.property('access');
        });
        if (body && body.access) bru.setEnvVar('employee_token', body.access);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Verify the employee OTP and capture employee_token without replacing the collection's normal access_token.
