info:
  name: 10. Get self-check QC context
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/qcs/employee-self-checks/{{self_check_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Self-check carries the existing QC checklist context", function () {
          expect(body.success).to.equal(true);
          expect(String(body.data.id)).to.equal(String(bru.getEnvVar('self_check_id')));
          expect(String(body.data.qc_checklist)).to.equal(String(bru.getEnvVar('checklist_id')));
          expect(body).to.have.nested.property('data.qc_context.items[0].id');
        });

        var item = body && body.data && body.data.qc_context && body.data.qc_context.items
          ? body.data.qc_context.items[0]
          : null;
        if (item && item.id) bru.setEnvVar('checklist_item_id', item.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Open EmployeeSelfCheck detail, verify it carries the existing QC checklist, and capture the first checklist_item_id.
