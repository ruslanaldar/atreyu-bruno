info:
  name: 05. List EmployeeTZ registrations
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-tz/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Verify inherited collection authentication against the EmployeeTZ list before creating the new registration.
