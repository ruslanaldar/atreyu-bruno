info:
  name: 05. List EmployeeTZ registrations
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-tz/"
  auth:
    type: bearer
    token: "{{employee_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Verify employee_token against the EmployeeTZ list before creating the new registration.
