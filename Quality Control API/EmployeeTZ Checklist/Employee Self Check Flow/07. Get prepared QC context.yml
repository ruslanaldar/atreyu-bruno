info:
  name: 07. Get prepared QC context
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/qcs/employee-tz/checklists/?tz_number={{tz_number}}"
  params:
    - name: tz_number
      value: "{{tz_number}}"
      type: query
  auth:
    type: bearer
    token: "{{employee_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var rows = body && Array.isArray(body.data) ? body.data : body;
        var row = Array.isArray(rows) ? rows[0] : rows;
        test("Prepared checklist matches EmployeeTZ", function () {
          expect(body.success).to.equal(true);
          expect(row.tz_number).to.equal(bru.getEnvVar('tz_number'));
          expect(row).to.have.property('employee_tz');
        });
        if (row) {
          if (row.id) bru.setEnvVar('checklist_id', row.id);
          if (row.employee_tz) bru.setEnvVar('employee_tz_uuid', row.employee_tz);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Verify EmployeeTZ prepared the reusable checklist/inspection context and capture checklist_id plus employee_tz_uuid. No QC task or notification should exist before self-check submission.
