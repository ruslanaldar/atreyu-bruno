info:
  name: Employee Self Check Flow
  type: folder
  seq: 2

request:
  auth: inherit

docs:
  content: |
    Full EmployeeTZ -> EmployeeSelfCheck -> QC final confirmation workflow.

    Authentication:
    - Login is handled by the collection-level Authentication requests.
    - Every request in this folder uses auth: inherit.

    Lifecycle:
    1. Register EmployeeTZ. This prepares reusable QC/FMEA/Control Plan/inspection context but does not open a QC task or notification.
    2. Find and capture the prepared checklist context.
    3. Submit EmployeeSelfCheck. This opens the QC task and sends QC notifications.
    4. Retrieve the submitted self-check and its connected QC context.
    5. Record QC checklist results using the existing checklist-item endpoint.
    6. QC creates the normal final GREEN PartTicket; EmployeeSelfCheck remains the handoff/audit context.

    Captured variables:
    tz_id, tz_number, checklist_id, employee_tz_uuid,
    self_check_id, self_check_qty,
    inspection_batch_id, and checklist_item_id.
  type: text/markdown
