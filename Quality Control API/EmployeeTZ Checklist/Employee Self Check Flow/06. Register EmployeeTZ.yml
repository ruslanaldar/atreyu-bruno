info:
  name: 06. Register EmployeeTZ
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/organization/categories/hr/employee-tz/"
  body:
    type: multipart-form
    data:
      - name: tz_number
        type: text
        value: ett_fdc522ab2a023e45_81z
      - name: employee
        type: text
        value: "313"
      - name: emp_id
        type: text
        value: "313"
      - name: emp_name
        type: text
        value: Tang Jixiao
      - name: source_ett_id
        type: text
        value: ett_2e36c50e9e9d2f13
      - name: production_date
        type: text
        value: 2026-08-05
      - name: start_time
        type: text
        value: 2026-08-05T8:00:00
      - name: end_time
        type: text
        value: 2026-08-05T10:18:00
      - name: container_no
        type: text
        value: s363
      - name: main_no
        type: text
        value: "60000509"
      - name: sub_no
        type: text
        value: "59501879"
      - name: center_code
        type: text
        value: l01
      - name: station_code
        type: text
        value: l0103
      - name: location
        type: text
        value: station location here
      - name: sequence
        type: text
        value: "1"
      - name: total_time
        type: text
        value: "81.12"
      - name: planned_qty
        type: text
        value: "104.0"
      - name: registered_qty
        type: text
        value: "11"
      - name: status
        type: text
        value: active
      - name: description
        type: text
        value: Registered from mobile time ticket
      - name: images
        type: file
        value: []
        contentType: image/jpeg
      - name: images
        type: file
        value: []
        contentType: image/jpeg
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data) {
          if (data.id) bru.setEnvVar('tz_id', data.id);
          if (data.tz_number) bru.setEnvVar('tz_number', data.tz_number);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Register completed work and capture tz_id/tz_number. Select up to two JPEG files in the images fields. This prepares reusable QC context but deliberately creates no QC task or notification yet.
