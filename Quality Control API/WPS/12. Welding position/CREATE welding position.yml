info:
  name: CREATE welding position
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/basics/wps/welding-positions/"
  body:
    type: json
    data: |-
      {
        "standard": "{{standard_id}}",
        "symbol": "TPA1",
        "description": "Test flat position",
        "equiv_other_std": "1G"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("welding_position_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
