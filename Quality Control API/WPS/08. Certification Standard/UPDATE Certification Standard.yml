info:
  name: UPDATE Certification Standard
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{base_url}}/basics/wps/standards/{{standard_id}}/"
  body:
    type: multipart-form
    data:
      - name: code
        type: text
        value: TESTSTD-1
      - name: name
        type: text
        value: Test Standard 1:2026 (Updated)
      - name: family
        type: text
        value: "{{std_family_id}}"
      - name: series
        type: text
        value: "1"
      - name: designation_format
        type: text
        value: "{{std_format_id}}"
      - name: material_scope
        type: text
        value: Test materials updated
      - name: country_region
        type: text
        value: Testland
      - name: status
        type: text
        value: active
      - name: image
        type: file
        value:
          - Parts Management API/6. Work Steps/image1.jpg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Request: Update Certification Standard
  Method: PATCH
  URL: {{base_url}}/api/basics/wps/standards/{{standard_id}}/

  Body Type:
  multipart-form

  Purpose:
  Updates standard metadata and can replace the standard reference image.
