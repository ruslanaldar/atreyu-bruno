info:
  name: CREATE designation-format
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/basics/wps/standard-families/"
  body:
    type: json
    data: |-
      {
        "code":"TESTFMT4",
        "name":"Test Designation Format 4",
        "description": "Used by CertificationStandard test",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("std_format_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
