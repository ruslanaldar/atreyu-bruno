info:
  name: CREATE CertificationStandard
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/basics/wps/standards/"
  body:
    type: multipart-form
    data:
      - name: code
        type: text
        value: TESTSTD-2
      - name: name
        type: text
        value: Test Standard 2:2026
      - name: family
        type: text
        value: "{{std_family_id}}"
      - name: series
        type: text
        value: "1"
      - name: designation_format
        type: text
        value: "{{std_format_id}}"
      - name: material_scope
        type: text
        value: Test materials
      - name: country_region
        type: text
        value: Testland
      - name: status
        type: text
        value: active
      - name: image
        type: file
        value:
          - Parts Management API/6. Work Steps/image1.jpg
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("standard_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Request: Create Certification Standard
  Method: POST
  URL: {{base_url}}/api/basics/wps/standards/

  Body Type:
  multipart-form

  Required Fields:
  code, name, family, designation_format, image

  Optional Fields:
  series, material_scope, country_region, status

  Capture:
  standard_id = data.id
