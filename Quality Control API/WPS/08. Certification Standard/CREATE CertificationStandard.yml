info:
  name: CREATE CertificationStandard
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/basics/wps/standards/"
  body:
    type: json
    data: |-
      {
        "code": "TESTSTD-2",
        "name": "Test Standard 2:2026",
        "family": "{{std_family_id}}",
        "series": "1",
        "designation_format": "4e12c072-a860-4909-b93a-0aea1976736a",
        "material_scope": "Test materials",
        "country_region": "Testland",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("standard_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
