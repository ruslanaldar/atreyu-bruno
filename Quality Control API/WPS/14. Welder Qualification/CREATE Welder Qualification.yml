info:
  name: CREATE Welder Qualification
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/basics/wps/welder-qualifications/"
  body:
    type: json
    data: |-
      {
        "employee": "1",
        "standard": "{{standard_id}}",
        "welding_process": "{{welding_process_id}}",
        "product_type": "{{product_type_id}}",
        "weld_type": "{{weld_type_id}}",
        "material_group": "{{material_group_weld_id}}",
        "filler_material_type": "{{filler_material_id}}",
        "deposited_thickness": "3.6",
        "outside_diameter": "60.0",
        "welding_position": "{{welding_position_id}}",
        "weld_details": ["{{weld_detail_id}}"],
        "certificate_number": "TEST-CERT-0001",
        "examiner_body": "Test Examiner Body",
        "wps_reference": "TEST-WPS-0001",
        "date_of_test": "2026-01-17",
        "valid_until": "2028-01-15",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("welder_qualification_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Request: Create Welder Qualification
  Method: POST
  URL: {{base_url}}/api/basics/wps/welder-qualifications/

  Purpose:
  Registers one employee qualification/certificate against a standard and welding variables.

  Required Fields:
  employee, standard, welding_process, product_type, weld_type, material_group,
  filler_material_type, welding_position, certificate_number, date_of_test, valid_until

  File Fields:
  certificate_image, certificate_file

  Important:
  Use UPLOAD Welder Qualification Files for certificate_image or certificate_file uploads
  after creating the qualification.

  Capture:
  welder_qualification_id = data.id
