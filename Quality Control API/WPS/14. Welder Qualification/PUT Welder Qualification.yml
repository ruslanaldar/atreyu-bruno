info:
  name: PUT Welder Qualification
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/basics/wps/welder-qualifications/"
  body:
    type: json
    data: |-
      {
        "id": "{{welder_qualification_id}}",
        "employee": "1",
        "standard": "{{standard_id}}",
        "welding_process": "{{welding_process_id}}",
        "product_type": "{{product_type_id}}",
        "weld_type": "{{weld_type_id}}",
        "material_group": "{{material_group_weld_id}}",
        "filler_material_type": "{{filler_material_id}}",
        "deposited_thickness": "3.7",
        "outside_diameter": "60.0",
        "welding_position": "{{welding_position_id}}",
        "weld_details": ["{{weld_detail_id}}"],
        "certificate_number": "TEST-CERT-0001",
        "examiner_body": "Test Examiner Body",
        "wps_reference": "TEST-WPS-0001",
        "date_of_test": "2026-01-17",
        "valid_until": "2028-01-15",
        "status": "active"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("welder_qualification_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
