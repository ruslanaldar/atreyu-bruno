info:
  name: CREATE Groove Type
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/basics/wps/groove-types/"
  body:
    type: multipart-form
    data:
      - name: code
        type: text
        value: TGV
      - name: name
        type: text
        value: Test Single V-groove
      - name: description
        type: text
        value: Created by Bruno WPS collection
      - name: status
        type: text
        value: active
      - name: image
        type: file
        value:
          - Parts Management API/6. Work Steps/image1.jpg
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data){
          bru.setEnvVar("groove_type_id", data.data.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Request: Create Groove Type
  Method: POST
  URL: {{base_url}}/api/basics/wps/groove-types/

  Required Fields:
  code, name, image

  Optional Fields:
  description, status

  Capture:
  groove_type_id = data.id
