info:
  name: filter actions by status
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/qcs/fmea/actions/?entry=7&status=In Progress"
  params:
    - name: entry
      value: "7"
      type: query
    - name: status
      value: In Progress
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data[0]) {
          bru.setEnvVar('action_id', data.data[0].id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: filter corrective actions for an FMEA entry by status.
  Backend: GET /qcs/fmea/actions/?entry=<id>&status=<status> handled by FMEAActionListView.
  Status choices from model: Open, In Progress, Completed, Verified. Use URL encoding for spaces, for example In%20Progress.
  Frontend note: status_map exists in the view but the current filter compares the raw status string, so send the exact model value.
  Response: success/message/data array.
