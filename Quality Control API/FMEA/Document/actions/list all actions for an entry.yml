info:
  name: list all actions for an entry
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/qcs/fmea/actions/?entry=7"
  params:
    - name: entry
      value: "7"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data[0]) {
          bru.setEnvVar('action_id', data.data[0].id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: list corrective actions attached to one FMEA entry.
  Backend: GET /qcs/fmea/actions/?entry=<entry_id> handled by FMEAActionListView.
  Filters: entry and status are supported.
  Returned fields: id, entry, action_taken, status, responsible, completion_date, severity_new, occurrence_new, detection_new, rpn_improved, rpn_improved_tier, created_at, updated_at.
  Status choices: Open, In Progress, Completed, Verified.
  Response: success/message/data array.
