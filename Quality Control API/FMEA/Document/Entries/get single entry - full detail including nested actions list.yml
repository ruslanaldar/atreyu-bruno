info:
  name: get single entry - full detail including nested actions list
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/qcs/fmea/entries/?document={{fmea_doc_id}}"
  params:
    - name: document
      value: "{{fmea_doc_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: fetch a single FMEA entry with nested corrective actions.
  Backend detail route: GET /qcs/fmea/entries/{entry_id}/ handled by FMEAEntryDetailView.
  Important mismatch: this Bruno request currently calls the list endpoint with document. For a true single-entry detail page, use /qcs/fmea/entries/{id}/.
  Detail fields include full failure text fields, computed rpn/rpn_tier/action_priority/inspection_rate/check_time_minutes, effective_process_name, responsible, due_date, is_customized, and nested actions.
  Response: success/message/data object from detail route.
