info:
  name: filter high-priority entries only
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/qcs/fmea/entries/?document={{fmea_doc_id}}&ap=H"
  params:
    - name: document
      value: "{{fmea_doc_id}}"
      type: query
    - name: ap
      value: H
      type: query
    - name: ap
      value: M
      type: query
      disabled: true
    - name: ap
      value: L
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: show only high-priority FMEA entries for a document.
  Backend: GET /qcs/fmea/entries/?document=<id>&ap=H handled by FMEAEntryListView.
  Filter behavior: ap=H returns entries whose computed action_priority is H from current S/O/D values.
  Model options: action_priority can be L, M, or H. High includes RPN 150-199 at 50% inspection and RPN 200+ at 100% inspection.
  Frontend note: good source for corrective-action queues and QC escalation views.
  Response: success/message/data array.
