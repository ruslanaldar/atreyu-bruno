info:
  name: get template by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/qcs/fmea/rpn-templates/{{rpn_template_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data[0]) {
          bru.setEnvVar('rpn_template_id', data.data[0].id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Purpose: fetch one RPN template for detail display or to prefill FMEA entry defaults.
  Backend: GET /qcs/fmea/rpn-templates/{id}/ handled by RPNTemplateDetailView.
  Returned fields: id, work_center, process_name, typical_failure_mode, default S/O/D scores, computed default_rpn, AP, control rate, check time, is_active, timestamps.
  Model options: default_action_priority is L, M, or H. Score values are 1-10.
  Frontend note: template scores are copied to FMEA entries at creation time; changing a template does not update existing entries.
  Response: success/message/data object.
