info:
  name: 01. List HR responsibility rules
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/task-routing-rules/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Responsibility-rule response exists", function () {
          expect(res.getBody()).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List responsibility rules through the HR-managed endpoint.
