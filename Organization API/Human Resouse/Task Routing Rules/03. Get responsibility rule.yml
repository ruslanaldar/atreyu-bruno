info:
  name: 03. Get responsibility rule
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/task-routing-rules/{{routing_rule_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        test("Requested rule is returned", function () {
          expect(String(data.id)).to.equal(String(bru.getEnvVar('routing_rule_id')));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieve routing_rule_id through the HR endpoint.
