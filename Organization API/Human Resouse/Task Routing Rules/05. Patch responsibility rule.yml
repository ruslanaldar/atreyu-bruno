info:
  name: 05. Patch responsibility rule
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/organization/categories/hr/task-routing-rules/{{routing_rule_id}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "priority": 120
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        test("Responsibility-rule priority was patched", function () {
          expect(Number(data.priority)).to.equal(120);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Partially update routing_rule_id.
