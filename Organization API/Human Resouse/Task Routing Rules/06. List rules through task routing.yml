info:
  name: 06. List rules through task routing
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/organization/task-routing/responsibility-rules/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Protected responsibility-rule response exists", function () {
          expect(res.getBody()).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List the same protected responsibility rules through the existing task-routing endpoint.
