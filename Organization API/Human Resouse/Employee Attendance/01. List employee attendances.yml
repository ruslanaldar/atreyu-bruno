info:
  name: 01. List employee attendances
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-attendances/?employee={{employee_id}}"
  params:
    - name: employee
      value: "{{employee_id}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Employee attendance response succeeded", function () {
          expect(body.success).to.equal(true);
          expect(body.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List EmployeeAttendance records filtered by employee_id.
