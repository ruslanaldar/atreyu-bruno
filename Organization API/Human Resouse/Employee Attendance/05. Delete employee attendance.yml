info:
  name: 05. Delete employee attendance
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}/organization/categories/hr/employee-attendances/{{attendance_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Attendance record was deleted", function () {
          expect(body.success).to.equal(true);
          expect(body.data).to.be.an('array').that.has.lengthOf(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Delete attendance_id. The updated API returns HTTP 200 with success=true and an empty data list.
