info:
  name: 03. Get employee attendance
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-attendances/{{attendance_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var data = body.data[0];
        test("Requested attendance record is returned", function () {
          expect(body.success).to.equal(true);
          expect(String(data.id)).to.equal(String(bru.getEnvVar('attendance_id')));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Retrieve the attendance record captured by request 02.
