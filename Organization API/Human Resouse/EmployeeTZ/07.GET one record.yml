info:
  name: GET one record
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-tz/?id={{employee_tz_id}}"
  params:
    - name: id
      value: "{{employee_tz_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This request retrieves a single record of an employee's time zone (TZ) information based on the provided ID. The ID is dynamically set using the environment variable `id`, which should be defined in previous requests or scripts.

  **Request Method:** GET

  **Endpoint:** `/organization/categories/hr/employee-tz/{{id}}/`

  **Authentication:** Inherited from the parent configuration.

  **Settings:**
  - URL Encoding: Enabled
  - Timeout: No timeout (0)
  - Follow Redirects: Enabled
  - Maximum Redirects: 5

  **Usage:**
  To use this request, ensure that the `id` environment variable is set to the specific employee TZ record you wish to retrieve. This can be done in a prior request or script that captures the ID from a list or search operation.
