  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data && data.length > 0) {
          bru.setEnvVar('id', data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This request creates a new Employee Time Zone (EmployeeTZ) registration in the system. It requires various details about the employee, the time zone, and related information. The request is sent as a POST request to the specified URL with the necessary data in JSON format.

  After the response is received, if the response contains data, it extracts the 'id' of the newly created EmployeeTZ and sets it as an environment variable 'employee_tz_id' for use in subsequent requests.
