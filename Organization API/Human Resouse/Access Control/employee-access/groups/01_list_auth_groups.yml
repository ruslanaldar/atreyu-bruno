info:
  name: List Auth Groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/auth-groups/"
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
          var body = JSON.parse(res.getBody());
          bru.setEnvVar("group_id", String(body.data[0].id));
          } catch(e) {
            bru.setEnvVar("group_id", "69");
          }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
