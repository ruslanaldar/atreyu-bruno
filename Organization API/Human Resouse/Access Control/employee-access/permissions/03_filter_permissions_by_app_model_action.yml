info:
  name: filter permissions by app model action
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/auth-permissions/?app_label=organization&model=customuser&action=view"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data && data.data.length > 0) {
            bru.setEnvVar("view_customuser_permission_id", data.data[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
