info:
  name: search manage_employee_access permissions
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/auth-permissions/?search=manage_employee_access"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        var data = res.getBody();
        if (data.data && data.data.length > 0) {
          bru.setEnvVar("manage_access_permission_id", data.data[0].id);
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
