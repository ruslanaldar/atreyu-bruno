info:
  name: list employees access/group context
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/organization/categories/hr/employee-access/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (data.data && data.data.length > 0) {
            bru.setEnvVar("employee_id", data.data[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
