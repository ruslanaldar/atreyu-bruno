info:
  name: Set-Auth Remove View Permission
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/organization/categories/hr/employee-access/{{employee_id}}/set-auth/"
  body:
    type: json
    data: |-
      {
        "mode": "remove",
        "user_permissions": [{{view_customuser_permission_id}}]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
