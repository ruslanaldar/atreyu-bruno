info:
  name: 02. List detailed tasks for user 333
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/organization/tasks/?assigned_to=333&owner_only=true&detail=true"
  params:
    - name: assigned_to
      value: "333"
      type: query
    - name: owner_only
      value: "true"
      type: query
    - name: detail
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Detailed central task list exists", function () {
          expect(body.success).to.equal(true);
          expect(body).to.have.property('tasks');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: User 333's normal central task list with engineering details included.
