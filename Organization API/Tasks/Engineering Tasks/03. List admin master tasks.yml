info:
  name: 03. List admin.master tasks
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/organization/tasks/?assigned_to=1&owner_only=true&detail=true"
  params:
    - name: assigned_to
      value: "1"
      type: query
    - name: owner_only
      value: "true"
      type: query
    - name: detail
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Admin central task list exists", function () {
          expect(body.success).to.equal(true);
          expect(body).to.have.property('tasks');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: admin.master's own detailed task list. An empty tasks array is valid when no incomplete candidate matches the admin's routing rule.
