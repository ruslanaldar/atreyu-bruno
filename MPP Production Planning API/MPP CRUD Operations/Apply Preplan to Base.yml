info:
  name: Apply Preplan to Base
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/productionplans/mpp/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "async": true,
          "trigger_reason": "manual_creation",
          "status": "produce",
          "shift_time": 10,
          "is_saturday": true,
          "week_no": 12,
          "preplan_applied": true
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ""
        method: jsonq
      variable:
        name: task_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  preplan_applied :\
  True - apply preplan shift assignment except sim employees

  False- cancel preplan_applied for the base_plan

  <br/>

  if preplan_applied is not provided it will take last settings for the preplan_applied.
