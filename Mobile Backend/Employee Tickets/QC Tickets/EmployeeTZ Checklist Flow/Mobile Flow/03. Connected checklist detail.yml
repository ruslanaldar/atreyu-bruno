info:
  name: Connected checklist detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/mobile/timetickets/qc-checklists/47ac40a5-fcbf-4f32-97d4-796d60f5cf9d/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data && data.items && data.items[0] && data.items[0].id) {
          bru.setEnvVar('mobile_item_id', data.items[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Fetch connected mobile EmployeeTZ QC checklist detail.
