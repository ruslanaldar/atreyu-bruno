info:
  name: 02. List employee self-checks by TZ number
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/mobile/timetickets/employee-self-checks/?tz_number={{tz_number}}"
  params:
    - name: tz_number
      value: "{{tz_number}}"
      type: query
  auth:
    type: bearer
    token: "{{employee_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Submitted mobile self-check is returned", function () {
          expect(body.success).to.equal(true);
          expect(String(body.data[0].id)).to.equal(String(bru.getEnvVar('self_check_id')));
          expect(body.data[0].status).to.equal('submitted');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List mobile EmployeeSelfCheck records filtered by tz_number and verify the record captured from request 01.
