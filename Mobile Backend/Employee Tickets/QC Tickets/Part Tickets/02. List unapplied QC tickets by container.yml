info:
  name: List unapplied QC tickets by container
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/mobile/timetickets/qc-tickets/?container_no=wk-0002&applied_only=false"
  params:
    - name: container_no
      value: wk-0002
      type: query
    - name: applied_only
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Description: List QC tickets for a container and include only unapplied tickets.
  Required query parameter: container_no.
