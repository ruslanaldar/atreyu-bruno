info:
  name: List failure type next level
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/mobile/timetickets/qc-tickets/failure-types/?parent_id={{subcategory_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var rows = body && body.results ? body.results : [];
        if (rows[0] && rows[0].id) bru.setEnvVar('failure_type_id', rows[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Continue using a selected child ID as parent_id for selection1 through selection4.
  Stop when has_children is false. That leaf node ID is submitted as PartTicket.failure_type.
