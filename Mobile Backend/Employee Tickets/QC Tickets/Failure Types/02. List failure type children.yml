info:
  name: List failure type children
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/mobile/timetickets/qc-tickets/failure-types/?parent_id={{main_failure_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var rows = body && body.results ? body.results : [];
        if (rows[0] && rows[0].id) bru.setEnvVar('subcategory_id', rows[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET with parent_id returns only the immediate children of that node.
  Use this when the frontend loads dependent dropdowns on demand.
