info:
  name: Create main failure type
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/mobile/timetickets/qc-tickets/failure-types/"
  body:
    type: json
    data: |-
      {
        "name": "Hurl temporary main failure",
        "code": "hurl-temp-main",
        "sort_order": 9999,
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data && data.id) bru.setEnvVar('crud_main_id', data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a root failure type. Omit parent to create a main failure.
