info:
  name: Patch mobile QC tool
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/mobile/qc/tools/{{mobile_qc_tool_id}}/"
  body:
    type: json
    data: |-
      {
        "condition": "calibrated",
        "remarks": "Updated through the mobile CRUD API."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Update the mobile-created QC tool condition and remarks.
