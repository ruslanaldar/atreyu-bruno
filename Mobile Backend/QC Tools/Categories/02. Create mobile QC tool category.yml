info:
  name: Create mobile QC tool category
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/mobile/qc/tools/categories/"
  body:
    type: json
    data: |-
      {
        "name": "Mobile Hurl Test Category",
        "description": "Temporary category created through the mobile CRUD API."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        if (data && data.id) bru.setEnvVar('mobile_qc_category_id', data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a QC-tool category through the mobile backend API and capture mobile_qc_category_id.
