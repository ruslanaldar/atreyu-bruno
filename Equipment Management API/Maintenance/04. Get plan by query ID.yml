info:
  name: 04. Get plan by query ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/basics/maintenance/plans/?id={{plan_id}}"
  params:
    - name: id
      value: "{{plan_id}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Requested maintenance plan is returned", function () {
          expect(body.success).to.equal(true);
          expect(String(body.data[0].id)).to.equal(String(bru.getVar('plan_id')));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieve plan_id through the list endpoint's query-parameter ID option.
