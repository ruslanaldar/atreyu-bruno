info:
  name: 15. Delete plan by query ID
  type: http
  seq: 15

http:
  method: DELETE
  url: "{{base_url}}/basics/maintenance/plans/?id={{plan_id}}"
  params:
    - name: id
      value: "{{plan_id}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Maintenance plan was deleted", function () {
          expect(body.success).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Delete plan_id through the list endpoint's query-parameter ID option after all dependent records have been removed.
