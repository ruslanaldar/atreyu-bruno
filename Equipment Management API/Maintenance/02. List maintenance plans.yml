info:
  name: 02. List maintenance plans
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/basics/maintenance/plans/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Maintenance plan list succeeded", function () {
          expect(body.success).to.equal(true);
          expect(body.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List every maintenance plan by omitting an ID.
