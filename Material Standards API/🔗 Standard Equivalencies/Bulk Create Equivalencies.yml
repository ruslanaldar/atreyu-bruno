info:
  name: Bulk Create Equivalencies
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/basics/materials/standard-equivalencies/bulk_create/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "equivalencies": [

          // GROUP 1: APPROXIMATE - same-class Mn steel peers, cross-standard (both directions)
          {
                "standard_1_id": 3974,
                "standard_2_id": 3973,
                "equivalency_type": "approximate",
                "confidence_level": 85,
                "notes": "GB 20Mn2 (GB/T 3077) and DIN 20Mn6 are both ~0.20%C manganese structural steels of the same class; GB Mn band 1.40-1.80 runs slightly higher than DIN 1.30-1.65, otherwise equivalent (Si, P/S <=0.035) and same application scope. GB 20Mn2 is the preferred Chinese procurement grade."
          },
          {
                "standard_1_id": 3973,
                "standard_2_id": 3974,
                "equivalency_type": "approximate",
                "confidence_level": 85,
                "notes": "DIN 20Mn6 and GB 20Mn2 are equivalent ~0.20%C ~1.5%Mn structural manganese steels with minor Mn-band difference. Reverse-direction record. For Chinese market sourcing specify GB 20Mn2."
          },
          {
                "standard_1_id": 3976,
                "standard_2_id": 3975,
                "equivalency_type": "approximate",
                "confidence_level": 85,
                "notes": "GB 30Mn2 (GB/T 3077) and DIN 30Mn5 are both ~0.30%C manganese quench-and-temper steels of the same strength class; GB Mn band slightly higher, otherwise equivalent composition and application. GB 30Mn2 is the preferred Chinese procurement grade."
          },
          {
                "standard_1_id": 3975,
                "standard_2_id": 3976,
                "equivalency_type": "approximate",
                "confidence_level": 85,
                "notes": "DIN 30Mn5 and GB 30Mn2 are equivalent ~0.30%C manganese Q+T steels with minor Mn-band difference. Reverse-direction record. For Chinese market sourcing specify GB 30Mn2."
          },

          // GROUP 2: BETTER - 30-series over 20-series upgrade matrix (standard_2 = superior)
          {
                "standard_1_id": 3974,
                "standard_2_id": 3976,
                "equivalency_type": "better",
                "confidence_level": 84,
                "notes": "Same-standard upgrade (GB): 30Mn2 higher carbon (0.27-0.34 vs 0.17-0.24) raises strength/hardness class over 20Mn2 in the quench-and-tempered condition. standard_2 (GB 30Mn2) is the superior grade."
          },
          {
                "standard_1_id": 3974,
                "standard_2_id": 3975,
                "equivalency_type": "better",
                "confidence_level": 82,
                "notes": "Cross-standard upgrade: from GB 20Mn2, DIN 30Mn5 is the higher-carbon, higher-strength alternative. standard_2 (DIN 30Mn5) is the superior grade."
          },
          {
                "standard_1_id": 3973,
                "standard_2_id": 3976,
                "equivalency_type": "better",
                "confidence_level": 82,
                "notes": "Cross-standard upgrade: from DIN 20Mn6, GB 30Mn2 is the higher-carbon, higher-strength alternative and preferred Chinese route. standard_2 (GB 30Mn2) is the superior grade."
          },
          {
                "standard_1_id": 3973,
                "standard_2_id": 3975,
                "equivalency_type": "better",
                "confidence_level": 84,
                "notes": "Same-standard upgrade (DIN): 30Mn5 higher carbon over 20Mn6 raises strength class in Q+T condition. standard_2 (DIN 30Mn5) is the superior grade."
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create multiple equivalencies at once
