info:
  name: Bulk Create Equivalencies
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/basics/materials/standard-equivalencies/bulk_create/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "equivalencies": [
          // ── GROUP 1: EXACT EQUIVALENTS — 150 MPa class ──────────────────
          // GG-15 (3900) ↔ GJL-150 (3901) ↔ HT150 (3902)

          // GB FIRST
          {
            "standard_1_id": 3902,
            "standard_2_id": 3900,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "GB HT150 and DIN GG-15 share identical tensile class (150 MPa min), carbon equivalent range, and lamellar graphite microstructure per GB/T 9439 vs DIN 1691. Both specify grey cast iron with predominantly pearlitic matrix. Fully interchangeable in non-critical castings; HT150 is the preferred designation for Chinese market procurement."
          },
          {
            "standard_1_id": 3902,
            "standard_2_id": 3901,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "GB HT150 and EN GJL-150 are equivalent grey lamellar iron grades at the 150 MPa tensile class. EN 1561 is the European harmonised standard governing GJL-150; GB/T 9439 governs HT150. Both specify minimum 150 MPa tensile strength on a 30 mm reference wall with no significant composition differences. HT150 is the preferred Chinese market alternative."
          },
          {
            "standard_1_id": 3900,
            "standard_2_id": 3901,
            "equivalency_type": "exact",
            "confidence_level": 98,
            "notes": "EN GJL-150 is the European harmonised replacement for DIN GG-15 under EN 1561, which superseded DIN 1691. Both designations refer to the same 150 MPa minimum tensile grey lamellar iron grade with identical CE range and microstructural requirements. DIN designation is legacy but still widely referenced in German engineering practice."
          },
          {
            "standard_1_id": 3900,
            "standard_2_id": 3902,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "DIN GG-15 maps directly to GB HT150; same minimum tensile strength (150 MPa), carbon equivalent range, and lamellar graphite microstructure. Application scope — low-stress housings, covers, and decorative castings — is identical. Chinese standard preferred for GB/T 9439 market procurement."
          },
          {
            "standard_1_id": 3901,
            "standard_2_id": 3900,
            "equivalency_type": "exact",
            "confidence_level": 98,
            "notes": "EN GJL-150 directly supersedes DIN GG-15 under EN 1561, which replaced DIN 1691. Same 150 MPa minimum tensile grey lamellar iron grade; designation differs only by era. DIN GG-15 remains the reference in legacy drawings and older German specifications."
          },
          {
            "standard_1_id": 3901,
            "standard_2_id": 3902,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "EN GJL-150 and GB HT150 both specify 150 MPa minimum tensile on a 30 mm reference wall section with equivalent CE ranges and lamellar graphite structure. EN 1561 and GB/T 9439 govern the respective grades with no meaningful composition differences. HT150 is the preferred Chinese market alternative to GJL-150."
          },

          // ── GROUP 2: EXACT EQUIVALENTS — 200 MPa class ──────────────────
          // GG-20 (3903) ↔ HT200 (3904)

          // GB FIRST
          {
            "standard_1_id": 3904,
            "standard_2_id": 3903,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "GB HT200 and DIN GG-20 are equivalent grey lamellar iron grades at the 200 MPa tensile class. Both governed by their respective standards (GB/T 9439 and DIN 1691) with the same CE range, predominantly pearlitic matrix, and application scope covering machine beds, engine blocks, and brake components. HT200 is the preferred designation for Chinese market procurement."
          },
          {
            "standard_1_id": 3903,
            "standard_2_id": 3904,
            "equivalency_type": "exact",
            "confidence_level": 97,
            "notes": "DIN GG-20 maps directly to GB HT200; same 200 MPa minimum tensile strength, carbon equivalent range, and pearlitic microstructure. Both are used in identical engineering applications — cylinder blocks, machine tool beds, gear housings, and brake drums. For Chinese market, specify HT200 per GB/T 9439."
          },

          // ── GROUP 3: BETTER GRADE — 150 MPa class → 200 MPa class ───────

          // GB recommended upgrade first
          {
            "standard_1_id": 3904,
            "standard_2_id": 3902,
            "equivalency_type": "better",
            "confidence_level": 85,
            "notes": "GB HT200 is one strength class above HT150 within the GB/T 9439 grey iron series. Higher pearlite fraction raises minimum tensile strength from 150 to 200 MPa while remaining in the same lamellar graphite iron family. Recommended Chinese-market upgrade for applications requiring improved tensile or compressive strength over HT150."
          },
          {
            "standard_1_id": 3902,
            "standard_2_id": 3904,
            "equivalency_type": "better",
            "confidence_level": 85,
            "notes": "HT150 is one strength class below HT200 within GB/T 9439. Upgrade to HT200 when tensile strength requirements exceed 150 MPa; both grades share the same grey lamellar iron family, identical casting and machining characteristics, and full process compatibility."
          },
          {
            "standard_1_id": 3904,
            "standard_2_id": 3901,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "GB HT200 is one strength class above EN GJL-150 (150 MPa class). For Chinese market projects where a higher-strength grey iron is required over GJL-150, HT200 per GB/T 9439 is the preferred domestic alternative at the 200 MPa tensile class within the same lamellar graphite iron family."
          },
          {
            "standard_1_id": 3901,
            "standard_2_id": 3904,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "EN GJL-150 is one strength class below GB HT200. Upgrade to HT200 when tensile requirements exceed 150 MPa; HT200 is the recommended Chinese-market step-up grade with superior domestic availability and identical casting process compatibility."
          },
          {
            "standard_1_id": 3903,
            "standard_2_id": 3900,
            "equivalency_type": "better",
            "confidence_level": 85,
            "notes": "DIN GG-20 is one strength class above GG-15 per DIN 1691. Higher pearlite content in the matrix raises minimum tensile strength from 150 to 200 MPa. Both grades are in the same grey lamellar iron family with identical casting and machinability characteristics; select GG-20 when loads exceed GG-15 capability."
          },
          {
            "standard_1_id": 3900,
            "standard_2_id": 3903,
            "equivalency_type": "better",
            "confidence_level": 85,
            "notes": "DIN GG-15 is one strength class below GG-20 per DIN 1691. Upgrade to GG-20 (or preferably GB HT200 for Chinese market) when minimum tensile requirements exceed 150 MPa. Same lamellar graphite iron family; no process changes required."
          },
          {
            "standard_1_id": 3904,
            "standard_2_id": 3900,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "GB HT200 is the recommended Chinese cross-standard upgrade over DIN GG-15; one strength class higher at 200 MPa minimum tensile within the same grey lamellar iron family. For Chinese market sourcing, HT200 offers the same step-up in strength with highest domestic foundry availability."
          },
          {
            "standard_1_id": 3900,
            "standard_2_id": 3904,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "DIN GG-15 is one strength class below GB HT200. When tensile requirements exceed 150 MPa, HT200 is the recommended Chinese-market alternative — same grey lamellar iron family, 200 MPa minimum tensile, and very high domestic availability per GB/T 9439."
          },
          {
            "standard_1_id": 3903,
            "standard_2_id": 3901,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "DIN GG-20 is one strength class above EN GJL-150; same grey lamellar iron family, 200 MPa vs 150 MPa minimum tensile class. Select GG-20 when loads exceed GJL-150 capability; for Chinese market applications, prefer GB HT200 as the equivalent upgrade grade."
          },
          {
            "standard_1_id": 3901,
            "standard_2_id": 3903,
            "equivalency_type": "better",
            "confidence_level": 83,
            "notes": "EN GJL-150 is one strength class below DIN GG-20. Upgrade to GG-20 when tensile requirements exceed 150 MPa within the DIN grey iron series; for Chinese market, GB HT200 is the preferred equivalent upgrade with higher domestic availability."
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create multiple equivalencies at once
