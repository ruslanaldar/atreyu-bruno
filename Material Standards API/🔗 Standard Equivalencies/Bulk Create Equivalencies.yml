info:
  name: Bulk Create Equivalencies
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/basics/materials/standard-equivalencies/bulk_create/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      // ════════════════════════════════════════════════════════════════════
      // BATCH 1 — POM EQUIVALENCIES
      // Delrin 500P POM-H (3936) ↔ EN ISO 9988 POM (3937)
      // ════════════════════════════════════════════════════════════════════
      {
        "equivalencies": [
          {
            "standard_1_id": 3936,
            "standard_2_id": 3937,
            "equivalency_type": "approximate",
            "confidence_level": 85,
            "notes": "Delrin 500P is DuPont's commercial POM homopolymer (POM-H) grade; EN ISO 9988 POM is the governing European/international classification standard covering both POM-H and POM-C types. Delrin 500P falls within the POM-H classification of ISO 9988. Key differences: POM-H (Delrin 500P) has higher tensile yield (~69 MPa vs ~60 MPa for POM-C), higher melting point (~178°C vs ~165°C), superior fatigue and creep resistance, but lower notched impact toughness and acid resistance vs POM-C. Approximate equivalency as ISO 9988 POM-H type — exact equivalence depends on which ISO 9988 sub-classification is specified."
          },
          {
            "standard_1_id": 3937,
            "standard_2_id": 3936,
            "equivalency_type": "approximate",
            "confidence_level": 85,
            "notes": "EN ISO 9988 POM classification standard covers both POM-H and POM-C acetal types. Delrin 500P is a specific commercial POM-H grade within ISO 9988 POM-H classification. When EN ISO 9988 POM-H type is specified, Delrin 500P (or equivalent domestic Chinese POM-H from Yunnan Yuntianhua or Shenhua Ningxia) is the direct procurement equivalent. For POM-C type per ISO 9988, specify Hostaform or Ultraform grades instead — Delrin 500P is not a POM-C equivalent."
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create multiple equivalencies at once
