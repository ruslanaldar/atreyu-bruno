info:
  name: Create Material Standard
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/basics/materials/material-standards/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "material_group_id": 16,
        "material_subgroup_id": 46,
        "organization_id": 7,
        "standard_number": "HT200",
        "description": "Grey lamellar graphite cast iron per GB/T 9439; minimum tensile strength 200 MPa on Ø30 mm test bar. One strength class above HT150; the most widely used engineering grey iron grade in China. Used in cylinder blocks, machine tool beds, gear housings, brake components, and general structural castings.",
        "material_price_kg": 0.65,
        "density_kg_m3": 7200.0,
        "chemical_composition": {
          "carbon": {
            "name": "Carbon",
            "symbol": "C",
            "unit": "% (wt)",
            "typical_range": { "min": 3.0, "max": 3.5 },
            "effect": "Lamellar graphite source; tighter range than HT150 for higher strength.",
            "value": "3.0–3.5%",
            "specification": "controlled via CE",
            "test_method": "GB/T 4336"
          },
          "silicon": {
            "name": "Silicon",
            "symbol": "Si",
            "unit": "% (wt)",
            "typical_range": { "min": 1.4, "max": 2.5 },
            "effect": "Graphitiser contributing to CE; controlled for 200 MPa class.",
            "value": "1.4–2.5%",
            "specification": null,
            "test_method": "GB/T 4336"
          },
          "manganese": {
            "name": "Manganese",
            "symbol": "Mn",
            "unit": "% (wt)",
            "typical_range": { "min": 0.6, "max": 1.0 },
            "effect": "Pearlite promoter; higher Mn vs HT150 aids strength increase.",
            "value": "0.6–1.0%",
            "specification": null,
            "test_method": "GB/T 4336"
          },
          "phosphorus": {
            "name": "Phosphorus",
            "symbol": "P",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.3 },
            "effect": "Steadite; controlled same as HT150.",
            "value": "≤0.3%",
            "specification": "≤0.3%",
            "test_method": "GB/T 4336"
          },
          "sulfur": {
            "name": "Sulphur",
            "symbol": "S",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.12 },
            "effect": "Low to promote graphitisation.",
            "value": "≤0.12%",
            "specification": "≤0.12%",
            "test_method": "GB/T 4336"
          },
          "iron": {
            "name": "Iron",
            "symbol": "Fe",
            "unit": "% (wt)",
            "typical_range": { "min": 92.5, "max": 95.0 },
            "effect": "Base metal; predominantly pearlitic matrix for HT200.",
            "value": "Balance",
            "specification": "Balance",
            "test_method": "Calculated"
          }
        },
        "material_properties": {
          "yield_strength": {
            "name": "Yield Strength (0.1% proof)",
            "symbol": "Rp0.1",
            "unit": "MPa",
            "typical_range": { "min": 130, "max": 160 },
            "effect": "Higher than HT150; pearlitic matrix raises proof stress.",
            "value": "~130 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "ultimate_tensile_strength": {
            "name": "Tensile Strength (min)",
            "symbol": "Rm",
            "unit": "MPa",
            "typical_range": { "min": 200, "max": 280 },
            "effect": "Grade-defining 200 MPa per GB/T 9439.",
            "value": "≥200 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "hardness_brinell": {
            "name": "Brinell Hardness",
            "symbol": "HB",
            "unit": "HB",
            "typical_range": { "min": 180, "max": 240 },
            "effect": "Higher pearlite content raises hardness over HT150.",
            "value": "180–240 HB",
            "test_standard": "GB/T 231.1",
            "category": "mechanical"
          },
          "elastic_modulus": {
            "name": "Elastic Modulus",
            "symbol": "E",
            "unit": "GPa",
            "typical_range": { "min": 88, "max": 113 },
            "effect": "Slightly stiffer than HT150.",
            "value": "88–113 GPa",
            "test_standard": "GB/T 22315",
            "category": "mechanical"
          },
          "compressive_strength": {
            "name": "Compressive Strength",
            "symbol": "σc",
            "unit": "MPa",
            "typical_range": { "min": 700, "max": 800 },
            "effect": "Higher compressive load capacity vs HT150.",
            "value": "~720 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "elongation": {
            "name": "Elongation at Break",
            "symbol": "A",
            "unit": "%",
            "typical_range": { "min": 0.0, "max": 0.8 },
            "effect": "Brittle; no meaningful elongation.",
            "value": "<0.8%",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "thermal_conductivity": {
            "name": "Thermal Conductivity",
            "symbol": "k",
            "unit": "W/(m·K)",
            "typical_range": { "min": 44, "max": 50 },
            "effect": "Slightly reduced vs HT150 due to pearlite matrix.",
            "value": "44–50 W/m·K",
            "test_standard": "GB/T 22588",
            "category": "physical"
          },
          "thermal_expansion": {
            "name": "Thermal Expansion Coefficient",
            "symbol": "α",
            "unit": "10⁻⁶/K",
            "typical_range": { "min": 10.5, "max": 12.0 },
            "effect": "Similar to HT150.",
            "value": "10.5–12.0×10⁻⁶/°C",
            "test_standard": "GB/T 4339",
            "category": "physical"
          },
          "weldability": {
            "name": "Weldability",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Poor; identical constraints to HT150. Nickel-electrode repair welding.",
            "value": "Poor",
            "test_standard": null,
            "category": "process"
          },
          "availability_china": {
            "name": "Availability in China",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Most common grey iron grade in Chinese foundries; ubiquitous domestic supply.",
            "value": "Very High",
            "test_standard": null,
            "category": "commercial"
          }
        },
        "is_active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a new material standard
