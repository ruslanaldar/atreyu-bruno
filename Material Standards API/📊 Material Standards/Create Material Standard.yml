info:
  name: Create Material Standard
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/basics/materials/material-standards/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "material_group_id": 27,
        "material_subgroup_id": 109,
        "organization_id": 7,
        "standard_number": "GB/T 24588 S30210",
        "description": "Austenitic stainless steel spring wire per GB/T 24588; full designation: GB/T 24588 S30210. Chinese standard for stainless steel spring wire equivalent to EN 10270-3 X10CrNi18-8 (1.4310) and ASTM A313 Type 302. S30210 designation: S = stainless, 302 = Type 302 composition family, 10 = C content modifier (higher C for spring wire). Cold-drawn to high tensile strength via work-hardening and deformation-induced martensite transformation. Used by the Chinese spring industry for compression, extension, and torsion springs in automotive, appliance, electronics, and general engineering applications requiring corrosion resistance. Most widely used stainless spring wire grade in China.",
        "material_price_kg": 4.50,
        "density_kg_m3": 7900.0,
        "chemical_composition": {
          "carbon": {
            "name": "Carbon",
            "symbol": "C",
            "unit": "% (wt)",
            "typical_range": { "min": 0.07, "max": 0.15 },
            "effect": "Higher C vs standard 304 (≤0.08%) per GB/T 24588; improves work-hardening response during cold drawing for spring wire applications.",
            "value": "0.07–0.15%",
            "specification": "0.07–0.15%",
            "test_method": "GB/T 4336"
          },
          "chromium": {
            "name": "Chromium",
            "symbol": "Cr",
            "unit": "% (wt)",
            "typical_range": { "min": 17.0, "max": 19.0 },
            "effect": "Primary corrosion resistance; same range as ASTM A313 Type 302. Passive Cr2O3 film provides stainless behaviour.",
            "value": "17.0–19.0%",
            "specification": "17.0–19.0%",
            "test_method": "GB/T 4336"
          },
          "nickel": {
            "name": "Nickel",
            "symbol": "Ni",
            "unit": "% (wt)",
            "typical_range": { "min": 7.0, "max": 10.0 },
            "effect": "Austenite stabiliser; range spans between EN 1.4310 (6.0–9.5%) and ASTM 302 (8.0–10.0%). Controls deformation martensite fraction during cold drawing.",
            "value": "7.0–10.0%",
            "specification": "7.0–10.0%",
            "test_method": "GB/T 4336"
          },
          "manganese": {
            "name": "Manganese",
            "symbol": "Mn",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 2.00 },
            "effect": "Austenite stabiliser; same limit as ASTM and EN equivalents.",
            "value": "≤2.00%",
            "specification": "≤2.00%",
            "test_method": "GB/T 4336"
          },
          "silicon": {
            "name": "Silicon",
            "symbol": "Si",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 1.00 },
            "effect": "Deoxidiser; contributes to oxidation resistance.",
            "value": "≤1.00%",
            "specification": "≤1.00%",
            "test_method": "GB/T 4336"
          },
          "phosphorus": {
            "name": "Phosphorus",
            "symbol": "P",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.035 },
            "effect": "Tighter P limit vs ASTM A313 (≤0.045%); consistent with GB/T 24588 quality requirements.",
            "value": "≤0.035%",
            "specification": "≤0.035%",
            "test_method": "GB/T 4336"
          },
          "sulfur": {
            "name": "Sulphur",
            "symbol": "S",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.020 },
            "effect": "Tight S limit per GB/T 24588; between EN (≤0.015%) and ASTM (≤0.030%) — controls MnS inclusions for fatigue life in spring wire.",
            "value": "≤0.020%",
            "specification": "≤0.020%",
            "test_method": "GB/T 4336"
          },
          "iron": {
            "name": "Iron",
            "symbol": "Fe",
            "unit": "% (wt)",
            "typical_range": { "min": 67.0, "max": 75.0 },
            "effect": "Base metal.",
            "value": "Balance",
            "specification": "Balance",
            "test_method": "Calculated"
          }
        },
        "material_properties": {
          "yield_strength": {
            "name": "Yield Strength (0.2% proof, cold drawn)",
            "symbol": "Rp0.2",
            "unit": "MPa",
            "typical_range": { "min": 1300, "max": 1800 },
            "effect": "High yield from cold-drawing work hardening and deformation-induced martensite; diameter dependent per GB/T 24588 Table 3.",
            "value": "1300–1800 MPa (diameter dependent)",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "ultimate_tensile_strength": {
            "name": "Tensile Strength (spring wire, diameter dependent)",
            "symbol": "Rm",
            "unit": "MPa",
            "typical_range": { "min": 1450, "max": 2000 },
            "effect": "Grade-defining property per GB/T 24588 Table 3; diameter dependent with finer wire achieving higher Rm. Comparable to EN 10270-3 VHS class.",
            "value": "1450–2000 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "elongation": {
            "name": "Elongation at Break",
            "symbol": "A",
            "unit": "%",
            "typical_range": { "min": 1, "max": 5 },
            "effect": "Low elongation from cold drawing; consistent with spring wire application requirements.",
            "value": "≥1%",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "hardness_vickers": {
            "name": "Vickers Hardness",
            "symbol": "HV",
            "unit": "HV",
            "typical_range": { "min": 400, "max": 530 },
            "effect": "High hardness consistent with cold-drawn spring wire; between EN 1.4310 and ASTM 302 CRE ranges.",
            "value": "400–530 HV",
            "test_standard": "GB/T 4340.1",
            "category": "mechanical"
          },
          "elastic_modulus": {
            "name": "Modulus of Rigidity (torsional)",
            "symbol": "G",
            "unit": "GPa",
            "typical_range": { "min": 68, "max": 72 },
            "effect": "Spring design parameter per GB/T 23935; same range as EN and ASTM equivalents.",
            "value": "~69 GPa",
            "test_standard": "GB/T 22315",
            "category": "mechanical"
          },
          "fatigue_strength": {
            "name": "Fatigue Strength (Wöhler, 10⁷ cycles)",
            "symbol": "σf",
            "unit": "MPa",
            "typical_range": { "min": 550, "max": 700 },
            "effect": "Good fatigue life; S ≤0.020% reduces MnS inclusion fatigue initiation sites. Between ASTM and EN equivalent values.",
            "value": "~580 MPa",
            "test_standard": "GB/T 4337",
            "category": "mechanical"
          },
          "thermal_conductivity": {
            "name": "Thermal Conductivity",
            "symbol": "k",
            "unit": "W/(m·K)",
            "typical_range": { "min": 14, "max": 17 },
            "effect": "Standard austenitic stainless value; same as ASTM 302 and EN 1.4310.",
            "value": "~16 W/m·K",
            "test_standard": "GB/T 22588",
            "category": "physical"
          },
          "thermal_expansion": {
            "name": "Thermal Expansion Coefficient",
            "symbol": "α",
            "unit": "10⁻⁶/K",
            "typical_range": { "min": 16.0, "max": 17.5 },
            "effect": "Standard austenitic stainless CTE; same as EN and ASTM equivalents.",
            "value": "~17.0×10⁻⁶/°C",
            "test_standard": "GB/T 4339",
            "category": "physical"
          },
          "magnetic_permeability": {
            "name": "Relative Magnetic Permeability",
            "symbol": "μr",
            "unit": "dimensionless",
            "typical_range": { "min": 1.02, "max": 3.50 },
            "effect": "Slightly magnetic after cold drawing due to deformation-induced martensite; consistent with Type 302 family behaviour.",
            "value": "1.02–3.50",
            "test_standard": "GB/T 1650",
            "category": "physical"
          },
          "corrosion_resistance": {
            "name": "Corrosion Resistance",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Good atmospheric and mild acid corrosion resistance; same as ASTM 302 and EN 1.4310. Not resistant to chloride SCC. Preferred over carbon spring wire in humid, chemical, or food-contact environments.",
            "value": "Good",
            "test_standard": "GB/T 10125",
            "category": "process"
          },
          "weldability": {
            "name": "Weldability",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Cold-work spring strength lost in HAZ; resistance welding for wire forms only. Not for structural welding in spring-temper condition.",
            "value": "Limited (HAZ softening)",
            "test_standard": null,
            "category": "process"
          },
          "availability_china": {
            "name": "Availability in China",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Standard GB/T 24588 grade; most widely used stainless spring wire in China. Produced by Baosteel, Fushun Special Steel, Qingshan, and major wire drawing mills. Very high domestic availability across all standard diameters.",
            "value": "Very High",
            "test_standard": null,
            "category": "commercial"
          }
        },
        "is_active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a new material standard
