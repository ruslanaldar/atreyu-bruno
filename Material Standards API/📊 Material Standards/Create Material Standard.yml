info:
  name: Create Material Standard
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/basics/materials/material-standards/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "material_group_id": 12,
        "material_subgroup_id": 10,
        "organization_id": 7,
        "standard_number": "25Mn",
        "description": "Unalloyed medium-manganese carbon steel per GB/T 699; full designation: GB 25Mn. Higher carbon (0.25% C) and elevated Mn (0.70–1.00%) vs GB 20Mn — one strength class above in the same Mn-carbon steel series. Chinese preferred better grade over 20Mn. Used for higher-load shafts, crankshafts, gears, connecting rods, bolts, and structural components requiring improved strength in the normalised or quenched-and-tempered condition. Highest domestic availability among the better-grade equivalents.",
        "material_price_kg": 0.72,
        "density_kg_m3": 7850.0,
        "chemical_composition": {
          "carbon": {
            "name": "Carbon",
            "symbol": "C",
            "unit": "% (wt)",
            "typical_range": { "min": 0.22, "max": 0.29 },
            "effect": "Higher C vs 20Mn (0.17–0.24%) provides improved hardenability and strength after heat treatment.",
            "value": "0.22–0.29%",
            "specification": "0.22–0.29%",
            "test_method": "GB/T 4336"
          },
          "manganese": {
            "name": "Manganese",
            "symbol": "Mn",
            "unit": "% (wt)",
            "typical_range": { "min": 0.70, "max": 1.00 },
            "effect": "Same Mn range as 20Mn; elevated vs plain 25# steel for improved hardenability.",
            "value": "0.70–1.00%",
            "specification": "0.70–1.00%",
            "test_method": "GB/T 4336"
          },
          "silicon": {
            "name": "Silicon",
            "symbol": "Si",
            "unit": "% (wt)",
            "typical_range": { "min": 0.17, "max": 0.37 },
            "effect": "Deoxidiser; minor strengthening contribution.",
            "value": "0.17–0.37%",
            "specification": "0.17–0.37%",
            "test_method": "GB/T 4336"
          },
          "phosphorus": {
            "name": "Phosphorus",
            "symbol": "P",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.035 },
            "effect": "Impurity; same tight limit as GB 20Mn per GB/T 699.",
            "value": "≤0.035%",
            "specification": "≤0.035%",
            "test_method": "GB/T 4336"
          },
          "sulfur": {
            "name": "Sulphur",
            "symbol": "S",
            "unit": "% (wt)",
            "typical_range": { "min": 0.0, "max": 0.035 },
            "effect": "Impurity; tight limit maintains toughness in Q+T condition.",
            "value": "≤0.035%",
            "specification": "≤0.035%",
            "test_method": "GB/T 4336"
          },
          "iron": {
            "name": "Iron",
            "symbol": "Fe",
            "unit": "% (wt)",
            "typical_range": { "min": 98.4, "max": 99.0 },
            "effect": "Base metal.",
            "value": "Balance",
            "specification": "Balance",
            "test_method": "Calculated"
          }
        },
        "material_properties": {
          "yield_strength": {
            "name": "Yield Strength (normalised)",
            "symbol": "ReL",
            "unit": "MPa",
            "typical_range": { "min": 330, "max": 430 },
            "effect": "One strength class above GB 20Mn; higher C raises proof stress in normalised condition.",
            "value": "≥330 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "ultimate_tensile_strength": {
            "name": "Tensile Strength (normalised)",
            "symbol": "Rm",
            "unit": "MPa",
            "typical_range": { "min": 540, "max": 680 },
            "effect": "Higher tensile than GB 20Mn; grade-defining improvement within GB/T 699 Mn-steel series.",
            "value": "540–680 MPa",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "elongation": {
            "name": "Elongation at Break",
            "symbol": "A5",
            "unit": "%",
            "typical_range": { "min": 19, "max": 25 },
            "effect": "Slightly reduced vs 20Mn due to higher C; acceptable ductility for engineering applications.",
            "value": "≥19%",
            "test_standard": "GB/T 228.1",
            "category": "mechanical"
          },
          "hardness_brinell": {
            "name": "Brinell Hardness (normalised)",
            "symbol": "HB",
            "unit": "HB",
            "typical_range": { "min": 156, "max": 207 },
            "effect": "Higher hardness than 20Mn; still machinable in annealed or normalised condition.",
            "value": "156–207 HB",
            "test_standard": "GB/T 231.1",
            "category": "mechanical"
          },
          "impact_toughness": {
            "name": "Charpy Impact Energy (normalised)",
            "symbol": "KV2",
            "unit": "J",
            "typical_range": { "min": 40, "max": 75 },
            "effect": "Good toughness maintained via tight P/S limits per GB/T 699; lower than 20Mn due to higher C.",
            "value": "≥40 J",
            "test_standard": "GB/T 229",
            "category": "mechanical"
          },
          "elastic_modulus": {
            "name": "Elastic Modulus",
            "symbol": "E",
            "unit": "GPa",
            "typical_range": { "min": 200, "max": 210 },
            "effect": "Standard steel modulus; composition-independent.",
            "value": "~205 GPa",
            "test_standard": "GB/T 22315",
            "category": "mechanical"
          },
          "thermal_conductivity": {
            "name": "Thermal Conductivity",
            "symbol": "k",
            "unit": "W/(m·K)",
            "typical_range": { "min": 44, "max": 50 },
            "effect": "Slightly lower than 20Mn due to marginally higher C and Mn.",
            "value": "~48 W/m·K",
            "test_standard": "GB/T 22588",
            "category": "physical"
          },
          "thermal_expansion": {
            "name": "Thermal Expansion Coefficient",
            "symbol": "α",
            "unit": "10⁻⁶/K",
            "typical_range": { "min": 11.0, "max": 12.5 },
            "effect": "Standard carbon steel CTE; same as 20Mn.",
            "value": "~11.5×10⁻⁶/°C",
            "test_standard": "GB/T 4339",
            "category": "physical"
          },
          "weldability": {
            "name": "Weldability",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Moderate weldability; CE ≈ 0.43. Preheat 75–150°C recommended for sections >25 mm. Post-weld stress relief advised.",
            "value": "Moderate",
            "test_standard": null,
            "category": "process"
          },
          "availability_china": {
            "name": "Availability in China",
            "symbol": null,
            "unit": "qualitative",
            "typical_range": null,
            "effect": "Standard GB/T 699 quality carbon structural steel; widely stocked at major Chinese steel mills. Preferred domestic better grade over 20Mn.",
            "value": "Very High",
            "test_standard": null,
            "category": "commercial"
          }
        },
        "is_active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a new material standard
