info:
  name: Create WorkStep Files
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/parts/work-step-files/"
  body:
    type: multipart-form
    data:
      - name: work_step
        type: text
        value: "{{work_step_id}}"
      - name: title
        type: text
        value: Cutting instruction
      - name: category_name_input
        type: text
        value: Instruction
      - name: description
        type: text
        value: Setup sheet for laser cutting
      - name: file
        type: file
        value:
          - /Users/ruslan/Downloads/wk_material.xlsx
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
