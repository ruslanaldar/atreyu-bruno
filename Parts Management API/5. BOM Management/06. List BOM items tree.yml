info:
  name: 06. List BOM items tree
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/parts/bom-items/for-bom/732/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var rows = body && Array.isArray(body.data) ? body.data : body;
        test("Tree rows include hierarchy and SubPart engineering data", function () {
          expect(rows).to.be.an('array').that.is.not.empty;
          expect(rows[0]).to.have.property('part_level');
          expect(rows[0]).to.have.nested.property('sub_part_details.serial');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Return tree-ordered rows for BOM 732 with part_level, direct display fields, and SubPart engineering data.
