info:
  name: 09. Get BOM detail
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/parts/boms/732/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        test("BOM detail includes tree-ordered items", function () {
          expect(data).to.have.property('bom_items');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Retrieve BOM 732 with the same tree-ordered bom_items used by the list endpoint.
