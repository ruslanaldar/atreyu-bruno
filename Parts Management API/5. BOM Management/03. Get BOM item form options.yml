info:
  name: 03. Get BOM item form options
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/parts/bom-items/form-options/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        var data = body && body.data ? body.data : body;
        test("All BOM item form options are available", function () {
          expect(data.item_type[0]).to.have.property('value');
          expect(data.make_buy[0]).to.have.property('value');
          expect(data).to.have.property('uom');
          expect(data).to.have.property('supplier');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Load enum choices, UOM records, and suppliers for BOM-item POST/PATCH forms.
