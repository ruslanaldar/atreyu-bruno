info:
  name: Upload work-step-file
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/parts/work-step-files/"
  body:
    type: json
    data: |-
      {"work_step": 123,
       "title": "Cutting instruction",
       "category_name_input": "Instruction",
       "descrition": "Setup sheet for laser cutting",
       "file": "{{File}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
