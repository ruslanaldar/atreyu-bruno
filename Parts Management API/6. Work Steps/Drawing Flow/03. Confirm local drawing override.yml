info:
  name: 03. Confirm local drawing override
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/parts/work-steps/273346/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        var body = res.getBody();
        test("Local drawing overrides inheritance", function () {
          expect(body).to.have.nested.property('data.result.drawing.mode', 'local');
          expect(body).to.have.nested.property('data.result.drawing.origin', 'workstep');
          expect(body).to.have.nested.property('data.result.drawing.is_connected', false);
          expect(String(body.data.result.drawing.file.id)).to.equal(String(bru.getEnvVar('workstep_file_id')));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Confirm that the newly uploaded local Drawing overrides the inherited source.
