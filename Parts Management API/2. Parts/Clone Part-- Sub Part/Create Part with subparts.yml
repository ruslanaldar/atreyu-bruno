info:
  name: Create Part with subparts
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/parts/parts/6828/clone"
  body:
    type: json
    data: |-
      {
        "part_id": 6828,
        "new_part_number": "new_part_number_001",
        "new_drawing_no": "new_drawing_no_001",
        "sub_parts": [
          {
            "subpart_id": 60245,
            "serial": "new_serial_001",
            "drawing_no": "new_drawing_001"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
