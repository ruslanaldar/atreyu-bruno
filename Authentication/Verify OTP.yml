info:
  name: Verify OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/organization/categories/otp/verify-otp/"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: ruslan.aldar@gmail.com
      - name: porpose
        type: text
        value: login
      - name: otp
        type: text
        value: "292929"

runtime:
  variables:
    - name: base_url
      value: http://27.223.82.66:18080/api
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        if (data.access) {
          bru.setVar("token", data.access);
          bru.setVar("auth_token", data.access);
          bru.setVar("jwt_token", data.access);
          bru.setVar("access_token", data.access);

          bru.setEnvVar("token", data.access);
          bru.setEnvVar("auth_token", data.access);
          bru.setEnvVar("jwt_token", data.access);
          bru.setEnvVar("access_token", data.access);

          bru.setGlobalEnvVar("token", data.access);
          bru.setGlobalEnvVar("auth_token", data.access);
          bru.setGlobalEnvVar("jwt_token", data.access);
          bru.setGlobalEnvVar("access_token", data.access);
        }

        if (data.refresh) {
          bru.setVar("refresh_token", data.refresh);
          bru.setEnvVar("refresh_token", data.refresh);
          bru.setGlobalEnvVar("refresh_token", data.refresh);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
